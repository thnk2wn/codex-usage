<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex Usage</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { min-height: 48px; }
    body { margin: 0; color: #17211f; background: transparent; }
    .card { border: 1px solid #dce4e1; border-radius: 12px; overflow: hidden; background: #fbfdfc; }
    .card.usage-warning { border-color: #d6a24a; box-shadow: inset 3px 0 #b7791f; }
    .card.usage-warning > details > summary { background: #fffaf0; }
    .card.usage-warning .mark { background: #b7791f; }
    .card.usage-warning .account-status { color: #8a5a0a; font-weight: 760; }
    .card.usage-critical { border-color: #dc6a63; box-shadow: inset 3px 0 #c2413b; }
    .card.usage-critical > details > summary { background: #fff3f2; }
    .card.usage-critical .mark { background: #c2413b; }
    .card.usage-critical .account-status { color: #a52f2a; font-weight: 780; }
    .card > details > summary { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; padding: 11px 13px; cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .mark { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 7px; color: white; background: #0f766e; font-weight: 750; font-size: 12px; }
    .line { min-width: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px 10px; }
    .title { font-size: 13px; font-weight: 720; }
    .status { color: #52615d; font-size: 12px; font-variant-numeric: tabular-nums; }
    .snapshot { color: #71807c; font-size: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .chevron { color: #71807c; transition: transform .16s ease; }
    .card > details[open] > summary .chevron { transform: rotate(180deg); }
    .detail { border-top: 1px solid #e5ebe9; padding: 13px; }
    .task { margin: 0 0 12px; font-size: 15px; font-weight: 720; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meter { height: 6px; border-radius: 99px; overflow: hidden; background: #e5ebe9; margin: 6px 0 13px; }
    .meter > span { display: block; height: 100%; border-radius: inherit; background: #0f766e; }
    .meter.notice > span { background: #6f8f88; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .metric { min-width: 0; padding: 9px; border-radius: 8px; background: #f0f5f3; }
    .metric span { display: flex; align-items: center; gap: 4px; color: #64736f; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
    .metric strong { display: block; margin-top: 3px; font-size: 14px; font-variant-numeric: tabular-nums; }
    .info { width: 13px; height: 13px; display: inline-grid; place-items: center; border: 1px solid currentColor; border-radius: 50%; font-size: 8px; font-style: normal; line-height: 1; opacity: .8; cursor: help; }
    .alert { margin-top: 10px; padding: 9px 10px; border-left: 3px solid #b7791f; border-radius: 5px; background: #fff7e8; font-size: 12px; }
    .alert.notice { border-color: #6f8f88; background: #edf5f2; }
    .alert strong { display: block; margin-bottom: 2px; }
    .pace { margin-top: 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 10px; border-radius: 7px; background: #eef4f2; font-size: 11px; }
    .pace.risk { background: #fff7e8; }
    .pace strong { display: block; font-size: 12px; }
    .pace span { color: #64736f; }
    .pace .projection { font-variant-numeric: tabular-nums; white-space: nowrap; }
    h3 { margin: 14px 0 6px; color: #52615d; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .tasks { display: grid; gap: 3px; }
    .details-loading { padding: 7px 0; color: #71807c; font-size: 10px; }
    .task-row { border-bottom: 1px solid #e5ebe9; }
    .task-row:last-child { border-bottom: 0; }
    .task-row > summary { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; padding: 4px 0; cursor: pointer; list-style: none; font-size: 11px; }
    .task-row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-row .share, .task-caret { color: #71807c; }
    .task-caret { transition: transform .16s ease; }
    .task-row[open] .task-caret { transform: rotate(180deg); }
    .task-breakdown { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 10px; padding: 4px 0 8px; color: #64736f; font-size: 10px; line-height: 1.35; }
    .task-breakdown strong { color: inherit; font-variant-numeric: tabular-nums; }
    .note { margin: 12px 0 0; color: #71807c; font-size: 10px; line-height: 1.35; }
    .settings { margin-top: 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 9px; color: #64736f; font-size: 10px; }
    .settings label { font-weight: 650; }
    .settings select { border: 1px solid #ccd8d4; border-radius: 6px; padding: 4px 22px 4px 7px; color: inherit; background: #f0f5f3; font: inherit; }
    .settings .saved { min-width: 34px; color: #0f766e; }
    .loading { padding: 12px 14px; color: #64736f; font-size: 12px; }
    @media (max-width: 520px) { .card > details > summary { gap: 8px; } .grid { grid-template-columns: repeat(2, 1fr); } .status { flex-basis: 100%; } }
    @media (prefers-color-scheme: dark) {
      body { color: #edf4f1; }
      .card { background: #151b1a; border-color: #34403d; }
      .card.usage-warning { border-color: #9a6f2b; }
      .card.usage-warning > details > summary { background: #2c261a; }
      .card.usage-warning .account-status { color: #f4bf61; }
      .card.usage-critical { border-color: #a94b46; }
      .card.usage-critical > details > summary { background: #301d1c; }
      .card.usage-critical .account-status { color: #ff8d86; }
      .status, h3 { color: #aebbb7; }
      .detail { border-color: #34403d; }
      .meter { background: #34403d; }
      .metric { background: #202927; }
      .metric span, .chevron, .snapshot, .task-row .share, .task-caret, .task-breakdown, .pace span, .note, .settings, .loading, .details-loading { color: #9caaa6; }
      .alert { background: #352a18; }
      .alert.notice, .pace { background: #202927; }
      .pace.risk { background: #352a18; }
      .task-row { border-color: #34403d; }
      .settings select { border-color: #34403d; background: #202927; }
      .settings .saved { color: #5eead4; }
    }
  </style>
</head>
<body>
  <main id="root" class="card"><div class="loading">Reading local Codex usage…</div></main>
  <script>
    (() => {
      const root = document.getElementById('root');
      const pendingRequests = new Map();
      let nextRequestId = 1;
      let reportedHeight = 0;
      let initialized = false;
      let latestData = null;
      let refreshTimer = null;
      let hydrating = false;
      let hydrateAttempts = 0;
      let deferred = null;
      let preferenceChannel = null;
      try {
        if (typeof BroadcastChannel === 'function') preferenceChannel = new BroadcastChannel('codex-usage-preferences-v1');
      } catch (_error) {
        // Some sandboxed clients isolate each card; expanding still reloads the preference.
      }
      const compact = n => new Intl.NumberFormat(undefined, { notation: 'compact', maximumFractionDigits: 0 }).format(Number(n || 0));
      const pct = n => n == null ? '—' : `${Number(n).toFixed(Number(n) < 10 ? 1 : 0)}%`;
      const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
      const when = epoch => epoch ? new Intl.DateTimeFormat(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }).format(new Date(epoch * 1000)) : '—';
      const clock = iso => iso ? new Intl.DateTimeFormat(undefined, { hour:'numeric', minute:'2-digit' }).format(new Date(iso)) : '—';
      const metric = (label, value, help) => `<div class="metric" title="${esc(help)}"><span>${esc(label)}<i class="info" aria-label="${esc(help)}">i</i></span><strong>${esc(value)}</strong></div>`;
      const structured = result => result?.structuredContent || result?.result?.structuredContent || result?.toolResult?.structuredContent;
      const META_KEY = 'codexUsage/report';
      // The card's render data arrives as component-only _meta, a first-paint
      // optimisation so the model's context never carries it. If a host does not
      // deliver it, the tool result still holds a reference and the card fetches
      // its own data through refresh_usage_card (see hydrate).
      //
      // Hosts expose the metadata under different global names and may hand over
      // the whole tool result (mcp_tool_result, call_tool_result, ...) with the
      // payload inside that result's own _meta, so nested envelopes are checked
      // before flat aliases. None of these helpers ever fall back to the
      // persistent window.openai globals on their own: those still hold the
      // ORIGINAL snapshot, and an event about something unrelated must not be
      // able to restore it over refreshed data. Only the bootstrap reads pass
      // window.openai in explicitly.
      const ENVELOPE_KEYS = ['mcp_tool_result', 'call_tool_result', 'toolResult', 'tool_result', 'result'];
      const metaCandidates = source => {
        if (!source || typeof source !== 'object') return [];
        const bases = [
          source.toolResponseMetadata, source.toolResponseMeta,
          source.toolOutputMetadata, source.toolMeta, source._meta, source
        ];
        const candidates = [];
        for (const base of bases) {
          if (!base || typeof base !== 'object') continue;
          for (const key of ENVELOPE_KEYS) {
            const nested = base[key];
            if (nested && typeof nested === 'object') {
              if (nested._meta && typeof nested._meta === 'object') candidates.push(nested._meta);
              candidates.push(nested);
            }
          }
          candidates.push(base);
        }
        return candidates;
      };
      const reportIn = source => {
        for (const candidate of metaCandidates(source)) {
          const report = candidate[META_KEY];
          if (report && report.kind === 'usage_card') return report;
        }
        return null;
      };
      // One rule for what a source contributes: its _meta report, else its
      // toolOutput (a full report or a usage_card_ref). Used for startup and
      // live updates alike so the two cannot drift.
      const cardFrom = source => reportIn(source) || source?.toolOutput;
      const notify = (method, params = {}) => {
        window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
      };
      const request = (method, params) => {
        const id = nextRequestId++;
        const response = new Promise((resolve, reject) => pendingRequests.set(id, { resolve, reject }));
        window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        return response;
      };
      // Fallback for hosts that do not deliver component metadata. It only ever
      // runs while nothing is rendered: once a card is on screen it is never
      // replaced by this path, so a re-delivered reference cannot destroy a good
      // card or un-freeze a historical snapshot. Transport failures retry with
      // bounded backoff, then offer an explicit Retry. A render error is not a
      // transport error and is never retried automatically.
      const HYDRATE_ATTEMPT_LIMIT = 4;
      const hydrateFailed = ref => {
        if (latestData) return;
        root.innerHTML = `<div class="loading">Could not read local Codex usage. <button type="button" id="hydrate-retry">Retry</button></div>`;
        const button = root.querySelector('#hydrate-retry');
        if (button) {
          button.addEventListener('click', () => {
            hydrateAttempts = 0;
            root.innerHTML = '<div class="loading">Reading local Codex usage…</div>';
            reportHeight();
            hydrate(ref);
          });
        }
        reportHeight();
      };
      const hydrate = ref => {
        const threadId = ref && ref.threadId;
        if (hydrating || !initialized || !threadId || latestData) return;
        if (hydrateAttempts >= HYDRATE_ATTEMPT_LIMIT) {
          hydrateFailed(ref);
          return;
        }
        hydrating = true;
        hydrateAttempts += 1;
        const retry = () => {
          hydrating = false;
          const backoff = Math.min(8000, 500 * Math.pow(2, hydrateAttempts));
          window.setTimeout(() => hydrate(ref), backoff);
        };
        request('tools/call', {
          name: 'refresh_usage_card',
          arguments: {
            thread_id: threadId,
            // Preserve the caller's live setting rather than assuming a new window.
            live: Boolean(ref.live),
            live_until_epoch_ms: Number(ref.liveUntilEpochMs || 0)
          }
        }).then(result => {
          const report = reportIn(result) || structured(result);
          if (!report) {
            retry();
            return;
          }
          hydrating = false;
          hydrateAttempts = 0;
          try {
            render(report);
          } catch (_error) {
            hydrateFailed(ref);
          }
        }, retry);
      };
      const reportHeight = () => {
        window.requestAnimationFrame(() => {
          const height = Math.ceil(Math.max(document.body.scrollHeight, document.body.getBoundingClientRect().height));
          if (height === reportedHeight) return;
          reportedHeight = height;
          window.openai?.notifyIntrinsicHeight?.(height);
        });
      };
      const applyPreferences = preferences => {
        if (!preferences || !Number.isInteger(preferences.autoCardIntervalSeconds)) return;
        if (latestData) latestData.preferences = preferences;
        const select = root.querySelector('#auto-card-interval');
        if (select && !select.disabled) select.value = String(preferences.autoCardIntervalSeconds);
      };
      const refreshPreferences = async () => {
        if (!initialized) return;
        try {
          const result = await request('tools/call', { name: 'get_usage_preferences', arguments: {} });
          applyPreferences(structured(result));
        } catch (_error) {
          // A historical usage snapshot remains useful if its live setting cannot load.
        }
      };
      preferenceChannel?.addEventListener('message', event => applyPreferences(event.data));
      const scheduleRefresh = data => {
        if (refreshTimer) window.clearTimeout(refreshTimer);
        refreshTimer = null;
        const live = data?.liveRefresh || {};
        const deadline = Number(live.untilEpochMs || 0);
        const needsDetails = data?.detailsLoaded === false;
        if (!initialized || !data?.thread?.id) return;
        if (!needsDetails && (!live.enabled || deadline <= Date.now())) return;
        const interval = Math.max(1000, Number(live.intervalMs || 3000));
        const delay = needsDetails
          ? (document.visibilityState === 'hidden' ? 1000 : 0)
          : Math.min(interval, Math.max(0, deadline - Date.now()));
        refreshTimer = window.setTimeout(async () => {
          if (document.visibilityState === 'hidden') {
            scheduleRefresh(data);
            return;
          }
          try {
            const result = await request('tools/call', {
              name: 'refresh_usage_card',
              arguments: {
                thread_id: data.thread.id,
                live_until_epoch_ms: deadline,
                live: Boolean(live.enabled)
              }
            });
            render(structured(result));
          } catch (_error) {
            refreshTimer = null;
          }
        }, delay);
      };
      function render(data) {
        if (!data) return;
        // A bare reference means the host did not deliver _meta: fetch the data.
        // Before ui/initialize resolves the bridge cannot be used, so keep the
        // reference and replay it once initialised.
        if (data.kind === 'usage_card_ref') {
          if (!initialized) deferred = data;
          else hydrate(data);
          return;
        }
        if (data.kind !== 'usage_card') return;
        // Never let an older snapshot of the same thread overwrite a newer one.
        // This holds regardless of which channel delivered it, so it does not
        // depend on hosts sending delta-only updates.
        if (latestData && latestData.thread?.id === data.thread?.id
            && data.generatedAt && latestData.generatedAt
            && new Date(data.generatedAt) < new Date(latestData.generatedAt)) {
          return;
        }
        latestData = data;
        const existing = root.querySelector(':scope > details');
        const expanded = existing ? existing.open : Boolean(window.openai?.widgetState?.expanded);
        const expandedTasks = new Set(Array.from(root.querySelectorAll('.task-row[open]')).map(row => row.dataset.taskId));
        const context = data.context || {};
        const session = data.sessionUsage || {};
        const latest = data.latestTurn || {};
        const limit = data.limit || {};
        const pace = data.pace;
        const windowDays = Number(limit.windowMinutes || 0) / 1440;
        const windowName = Number.isInteger(windowDays) && windowDays > 0 ? `${windowDays}-day` : 'Account';
        const remainingPercent = limit.usedPercent == null ? null : Math.max(0, 100 - Number(limit.usedPercent));
        const projectedOver = pace?.status === 'likely_exhausts' || Number(pace?.projectedPercent || 0) > 100;
        const usageLevel = remainingPercent != null && remainingPercent <= 10
          ? 'critical'
          : (remainingPercent != null && remainingPercent <= 15) || projectedOver
            ? 'warning'
            : 'normal';
        const account = remainingPercent == null
          ? `${windowName} —`
          : `${windowName} ${pct(remainingPercent)} left${projectedOver && remainingPercent > 15 ? ' · projected over' : ''}`;
        const accountHelp = usageLevel === 'critical'
          ? 'Critical: 10% or less remains in the active account limit window.'
          : usageLevel === 'warning'
            ? remainingPercent != null && remainingPercent <= 15
              ? 'Warning: 15% or less remains in the active account limit window.'
              : 'Warning: current average pace is projected to exceed the account limit.'
            : 'Remaining capacity in the active account limit window.';
        root.className = `card usage-${usageLevel}`;
        const taskRows = (data.topTasks || []).map(task => `<details class="task-row" data-task-id="${esc(task.id)}" ${expandedTasks.has(String(task.id)) ? 'open' : ''}><summary title="Show token composition"><span class="name">${esc(task.name)}</span><strong>${compact(task.totalTokens)}</strong><span class="share">${pct(task.sharePercent)}</span><span class="task-caret">⌄</span></summary><div class="task-breakdown"><span>Input <strong>${compact(task.inputTokens)}</strong></span><span>Cached <strong>${pct(task.cachedPercent)}</strong></span><span>Output <strong>${compact(task.outputTokens)}</strong></span><span>Reasoning <strong>${compact(task.reasoningOutputTokens)}</strong></span><span>Responses <strong>${compact(task.responses)}</strong></span><span>${esc(task.model || task.source || 'unknown')}</span></div></details>`).join('');
        const alerts = (data.alerts || []).map(alert => `<div class="alert ${esc(alert.level)}"><strong>${esc(alert.title)}</strong>${esc(alert.detail)}</div>`).join('');
        let paceRow = '';
        if (pace) {
          const risk = pace.status === 'likely_exhausts';
          const headline = risk ? `Likely reaches the limit ${when(pace.reachesLimitAt)}` : 'On pace to stay within the limit';
          const detail = `${pct(pace.elapsedPercent)} of time elapsed · ${pct(limit.usedPercent)} used`;
          paceRow = `<div class="pace ${risk ? 'risk' : ''}" title="Projection uses the average aggregate usage rate since this account window began; it will change as your pace changes."><div><strong>${esc(headline)}</strong><span>${esc(detail)}</span></div><strong class="projection">${pct(pace.projectedPercent)} projected</strong></div>`;
        }
        const interval = Number(data.preferences?.autoCardIntervalSeconds ?? 900);
        const taskDetails = data.detailsLoaded === false
          ? '<div class="details-loading">Loading cross-task breakdown…</div>'
          : (taskRows || '<span class="note">No recorded activity.</span>');
        root.innerHTML = `
          <details ${expanded ? 'open' : ''}>
            <summary>
              <span class="mark">CU</span>
              <span class="line"><span class="title">Codex usage</span><span class="status">Context ${pct(context.usedPercent)} · Task ${compact(data.combinedTokens)} raw · <strong class="account-status" title="${esc(accountHelp)}">${esc(account)}</strong></span></span>
              <span class="chevron" aria-hidden="true">⌄</span>
              <span class="snapshot" title="Snapshot time. This card refreshes briefly, then freezes.">${esc(clock(data.generatedAt))}</span>
            </summary>
            <section class="detail">
              <p class="task" title="${esc(data.thread?.name)}">${esc(data.thread?.name || 'Current conversation')}</p>
              <div class="meter ${esc(context.level)}"><span style="width:${Math.min(100, Number(context.usedPercent || 0))}%"></span></div>
              <div class="grid">
                ${metric('Context input', `${compact(context.inputTokens)} / ${compact(context.windowTokens)}`, 'Input tokens sent to the latest model response compared with this model context window. It can drop after automatic compaction.')}
                ${metric('Task + children', `${compact(data.combinedTokens)} raw`, 'Cumulative raw processed tokens in this task plus its directly spawned child tasks. Repeated context is counted again on every model response.')}
                ${metric('Input cache hit', pct(session.cachedPercent), 'Share of this task’s cumulative input tokens served from cache. Cached tokens are a subset of input, not additional tokens.')}
                ${metric('Last output', compact(latest.outputTokens), 'Output tokens from the latest recorded model response—not characters. Reasoning tokens are included within output tokens.')}
                ${metric('Last processed', compact(latest.totalTokens), 'Input plus output tokens for the latest recorded model response. Cached input and reasoning are subsets, not extra tokens.')}
                ${metric('Child tasks', `${data.subagentCount || 0} · ${compact(data.subagentTokens)} raw`, 'Direct subagents spawned by this task, followed by their cumulative raw processed tokens.')}
                ${metric(`${windowName} usage`, pct(limit.usedPercent), 'The latest aggregate account-limit snapshot for the active window. This is authoritative for the percentage, but Codex does not expose its per-task weighting formula.')}
                ${metric('Limit resets', when(limit.resetsAt), 'When the active aggregate account-limit window resets.')}
              </div>
              ${paceRow}
              ${alerts}
              <h3>Top 5 tasks this limit window · click a row for composition</h3>
              <div class="tasks">${taskDetails}</div>
              <p class="note">Raw local token counters are attribution clues, not an authoritative quota ledger. Cached input, model choice, reasoning, and internal work may be weighted differently.</p>
              <div class="settings" title="Controls the minimum time between new automatic cards in each task. Existing cards remain historical snapshots.">
                <label for="auto-card-interval">Automatic cards</label>
                <select id="auto-card-interval">
                  <option value="0" ${interval === 0 ? 'selected' : ''}>Every turn</option>
                  <option value="30" ${interval === 30 ? 'selected' : ''}>30 seconds</option>
                  <option value="60" ${interval === 60 ? 'selected' : ''}>1 minute</option>
                  <option value="300" ${interval === 300 ? 'selected' : ''}>5 minutes</option>
                  <option value="900" ${interval === 900 ? 'selected' : ''}>15 minutes</option>
                  <option value="-1" ${interval < 0 ? 'selected' : ''}>Off</option>
                </select>
                <span id="preference-status" class="saved" aria-live="polite"></span>
              </div>
            </section>
          </details>`;
        const details = root.querySelector('details');
        details.addEventListener('toggle', () => {
          window.openai?.setWidgetState?.({ expanded: details.open });
          if (details.open) refreshPreferences();
          reportHeight();
        });
        const intervalSelect = root.querySelector('#auto-card-interval');
        intervalSelect.addEventListener('change', async () => {
          const status = root.querySelector('#preference-status');
          intervalSelect.disabled = true;
          status.textContent = 'Saving…';
          try {
            const result = await request('tools/call', {
              name: 'set_auto_card_interval',
              arguments: { interval_seconds: Number(intervalSelect.value) }
            });
            const preferences = structured(result);
            applyPreferences(preferences);
            if (preferences?.kind === 'usage_preferences') preferenceChannel?.postMessage(preferences);
            status.textContent = 'Saved';
          } catch (_error) {
            status.textContent = 'Could not save';
          } finally {
            intervalSelect.disabled = false;
          }
        });
        reportHeight();
        scheduleRefresh(data);
      }

      window.addEventListener('openai:set_globals', event => {
        const globals = event.detail?.globals;
        if (!globals) return;
        // Read only this update; an unrelated change contributes nothing.
        render(cardFrom(globals));
      });
      window.addEventListener('message', event => {
        if (event.source !== window.parent) return;
        const message = event.data || {};
        if (message.jsonrpc !== '2.0') return;
        if (message.id !== undefined && pendingRequests.has(message.id)) {
          const pending = pendingRequests.get(message.id);
          pendingRequests.delete(message.id);
          if (message.error) pending.reject(message.error);
          else pending.resolve(message.result);
          return;
        }
        if (message.method === 'ui/notifications/tool-result') {
          const params = message.params || {};
          render(reportIn(params) || structured(params));
        }
      }, { passive: true });
      render(cardFrom(window.openai));
      request('ui/initialize', {
        appInfo: { name: 'codex-usage', version: '0.3.0' },
        appCapabilities: { availableDisplayModes: ['inline'] },
        protocolVersion: '2025-11-21'
      }).then(() => {
        initialized = true;
        notify('ui/notifications/initialized');
        // The pre-init render already built the card if data was available; the
        // only thing it could not do was arm refreshes. Otherwise replay a
        // reference seen before init, or read the persistent globals now.
        if (latestData) scheduleRefresh(latestData);
        else render(deferred || cardFrom(window.openai));
        deferred = null;
        reportHeight();
      }).catch(() => {
        reportHeight();
      });
    })();
  </script>
</body>
</html>
